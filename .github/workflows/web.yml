name: Web

# The web orchard: typecheck, node tests and a production build. Path-filtered
# to web/ so a kit-only change does not spend a runner here. A push or manual
# run on main also publishes web/dist to GitHub Pages at
# https://flux-frontiers.github.io/kpress_family/, with the user guide (docs/,
# mkdocs.yml) rendered into web/dist/docs beside it, as knowledge_press does.
#
# The families are not in git: `make families-publish` uploads the public demo
# families as families.tar.gz on the draft `family-data` release, and every
# build unpacks it into web/public/families, so a pull request proves the
# download works too.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "!web/**.md"
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "!web/**.md"
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web Build
    runs-on: ubuntu-latest
    # Write, because a draft release is invisible to a read-only token.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Fetch the families
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download family-data --repo "$GITHUB_REPOSITORY" --pattern families.tar.gz --dir "$RUNNER_TEMP"
          mkdir -p public/families
          tar -xzf "$RUNNER_TEMP/families.tar.gz" -C public/families
          cat public/families/index.json
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      # --strict fails the build on a broken link or a page missing from the nav.
      - name: Build the user guide
        working-directory: ${{ github.workspace }}
        run: |
          pip install -q -r docs/requirements.txt
          mkdocs build --strict --site-dir web/dist/docs
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: web/dist

  deploy:
    name: Deploy to Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # A newer push queues behind a deploy in progress rather than cutting it off.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
